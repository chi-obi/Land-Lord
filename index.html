<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Land Lord</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="styles.css"/>
    </head>

    <body class="bg-gray-50">

        <!-- Filter bar -->
         <div class="bg-white border-b border-gray-200 px-8 py-4">
            <div class="flex flex-wrap gap-4 items-end">

                <!-- Type filter -->
                 <div class="flex flex-col gap-1">
                    <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">
                        Type
                    </label>
                    <select id="filter-type" class="border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500">
                        <option value="all">All listings</option>
                        <option value="rent">For rent</option>
                        <option value="buy">For sale</option>
                    </select>
                 </div>

                 <!-- City filter -->
                  <div class="flex flex-col gap-1">
                    <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">
                        City
                    </label>
                    <select id="filter-city" class="border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500">
                        <option value="all">All cities</option>
                    </select>
                  </div>

                  <!-- Beds filter -->
                   <div class="flex flex-col gap-1">
                    <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">
                        Beds
                    </label>
                    <select id="filter-beds" class="border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-teal-500">
                        <option value="0">Any</option>
                        <option value="1">1+ bed</option>
                        <option value="2">2+ beds</option>
                        <option value="3">3+ beds</option>
                    </select>
                   </div>

                   <!-- Max price filter -->
                    <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">
                            Max price
                        </label>
                        <input
                            id="filter-price"
                            type="number"
                            placeholder="No limit"
                            class="border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-700 w-36 focus:outline-none focus:ring-2 focus:ring-teal-500"
                        />
                    </div>

                    <!-- Currency Filter -->
                     <div class="flex flex-col gap-1">
                        <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">
                            Currency
                        </label>
                        <select id="currency-select" class="border border-gray-200 rounded-lg px-3 py-2 text-sm text-gray-700 bg-white focus:outline-none focus:ring-teal-500">
                            <option value="USD">USD - US Dollar</option>
                            <option value="CAD">CAD - Canadian Dollar</option>
                            <option value="NGN">NGN - Nigerian Naira</option>
                            <option value="AUD">AUD - Australian Dollar</option>
                        </select>
                     </div>
                     

                    <!-- Resuls count -->
                     <div class="flex flex-col justify-end">
                        <p id="results-count" class="text-sm text-gray-400 pb-2">
                            Showing all listings
                        </p>
                     </div>

            </div>
         </div>


        <div id="card-grid"></div>

        <!-- Load in dependency order: data -- helpers -- components -- app -->
        <script src="properties.js"></script>
        <script src="utils.js"></script>
        <script src="components.js"></script>
        <script src="app.js"></script>

    </body>
</html>
